name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Workflow files parse (a broken pages.yml fails silently otherwise)
        run: python3 -c "import sys, yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('ok')"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: wasm32 build
        run: cargo build -p skyfix-wasm -p skyfix-core -p skyfix-ephemeris -p skyfix-sim --target wasm32-unknown-unknown
      - name: Offline smoke test (no network, no data downloads)
        run: |
          cargo build -p skyfix-cli --release
          sudo unshare -n ./target/release/skyfix --help
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: Web (typecheck and tests against the built core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build the WASM core
        run: npm run wasm --prefix web
      - name: Install
        run: npm ci --prefix web
      - name: Typecheck
        run: npm run typecheck --prefix web
      - name: Tests (VERIFICATION_2 V13)
        run: "cd web && npx vitest run --maxWorkers=2"
