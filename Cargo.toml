[workspace]
resolver = "3"
members = [
    "crates/skyfix-core",
    "crates/skyfix-ephemeris",
    "crates/skyfix-sim",
    "crates/skyfix-cli",
    "crates/skyfix-wasm",
    "crates/skyfix-camera",
    "crates/skyfix-polar",
    "crates/skyfix-motion",
    "crates/skyfix-almanac",
    "crates/skyfix-starfield",
    # Expansion programme (geomag agent): WMM2025 and IGRF-14.
    "crates/skyfix-geomag",
    # Expansion programme (tides agent): harmonic tide predictions, the tides-us pack.
    "crates/skyfix-tides",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/holdTheDoorHoid/skyfix-lab"
rust-version = "1.85"

# Pinned in Cargo.lock; keep this list short and justify every addition in THIRD_PARTY.md.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
approx = "0.5.1"
wasm-bindgen = "0.2.128"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.105"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# WASM: smaller binary, still fast enough for a 2-3 parameter solver.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
