<!doctype html>
<!--
  /classic/ was the original SkyFix Lab workbench. It was retired in the expansion
  programme (docs/EXPANSION_PLAN.md 2.4): everything it did is in the explorer at the
  site's home page. This page only forwards there, keeping the query and mapping the old
  views' fragments to the explorer's: #observations, #corrections, #fix and #planner to
  #navigate, #simulator to #learn, #about to #about, anything else to #navigate.
  Built as it is, never precached; the service worker answers the same forward itself,
  offline too (vite.config.ts CLASSIC_VIEWS, src/sw/policy.ts forwardPageHtml; a test
  keeps this page and the worker's in step). OWNER: packs agent.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>SkyFix Lab has moved</title>
    <script>
      (function () {
        var map = { observations: 'navigate', corrections: 'navigate', fix: 'navigate', planner: 'navigate', simulator: 'learn', about: 'about' };
        var name = location.hash.replace(/^#/, '');
        var view = Object.prototype.hasOwnProperty.call(map, name) ? map[name] : 'navigate';
        location.replace('../' + location.search + '#' + view);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../#navigate" /></noscript>
    <style>
      body {
        margin: 0;
        padding: 12vh 20px 0;
        background: #131a21;
        color: #f1f4f7;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      a {
        color: #f5c35c;
      }
    </style>
  </head>
  <body>
    <p>
      The original SkyFix Lab workbench was retired. Everything it did is in the explorer:
      sights, corrections, the fix and the planner in <a href="../#navigate">Navigate</a>, the
      simulator in <a href="../#learn">Learn</a>.
    </p>
  </body>
</html>
