<!doctype html>
<!--
  /next/ was the explorer's address while it was being built; since the switch-over
  (2026-09-24) the explorer is the site's home page. This page only forwards there,
  keeping the query and, above all, the fragment: share links carry the place and time in
  it (#v=1&lat=…). Built as it is, never precached as an app page; the service worker
  answers the same redirect itself, offline too (vite.config.ts `redirects`).
  OWNER: release agent. The developer pages beside it (dev-*.html, mockup.html) are
  served by `vite` in development only.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>SkyFix Lab has moved</title>
    <script>
      location.replace('../' + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=../" />
    <style>
      body {
        margin: 0;
        padding: 12vh 20px 0;
        background: #131a21;
        color: #f1f4f7;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      a {
        color: #f5c35c;
      }
    </style>
  </head>
  <body>
    <p>The SkyFix Lab explorer has moved to <a href="../">the site's home page</a>.</p>
  </body>
</html>
