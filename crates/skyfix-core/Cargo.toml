[package]
name = "skyfix-core"
description = "Units, conventions, sight reduction, corrections, position solver and uncertainty for SkyFix Lab. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
# session.rs (CONVENTIONS section 10) parses the session document; the core cannot
# depend on the CLI to do it. Pure Rust, builds for wasm32-unknown-unknown.
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
# Integration tests of the navigation methods (tests/nav_methods_*.rs) run them against
# the real ephemeris. A dev-dependency cycle (skyfix-ephemeris depends on this crate) is
# fine for integration tests, which link the same skyfix-core the ephemeris does.
skyfix-ephemeris = { path = "../skyfix-ephemeris" }
