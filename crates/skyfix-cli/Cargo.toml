[package]
name = "skyfix-cli"
description = "skyfix: reduce, solve, simulate, validate and plan celestial fixes offline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "skyfix"
path = "src/main.rs"

[dependencies]
skyfix-core = { path = "../skyfix-core" }
skyfix-ephemeris = { path = "../skyfix-ephemeris" }
skyfix-sim = { path = "../skyfix-sim" }
# `skyfix almanac` (the daily pages) and the explorer commands (commands/explorer):
# sky state and events, the running fix, and the display-only constellation labels
# `skyfix sky` joins in (CONVENTIONS 13.6).
skyfix-almanac = { path = "../skyfix-almanac" }
skyfix-motion = { path = "../skyfix-motion" }
skyfix-starfield = { path = "../skyfix-starfield" }
# The expansion programme's commands (cli3 agent): the magnetic field and the tides-us
# pack's types, and the WASM adapter's native layer. Each `skyfix-wasm::<module>::native`
# function takes the export's own arguments and returns what the export serialises, so a
# command that calls it prints the JSON the browser receives by construction — the wire
# structs, candidate lists, pack registry and producers live there once instead of being
# copied here (docs/CLI.md, "The expansion programme's engines").
skyfix-geomag = { path = "../skyfix-geomag" }
skyfix-tides = { path = "../skyfix-tides" }
skyfix-wasm = { path = "../skyfix-wasm" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

