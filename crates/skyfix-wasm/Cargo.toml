[package]
name = "skyfix-wasm"
description = "wasm-bindgen adapter exposing skyfix-core to the browser UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
skyfix-core = { path = "../skyfix-core" }
skyfix-ephemeris = { path = "../skyfix-ephemeris" }
skyfix-sim = { path = "../skyfix-sim" }
skyfix-almanac = { path = "../skyfix-almanac" }
skyfix-starfield = { path = "../skyfix-starfield" }
# nav.rs exposes the running fix (docs/EXPLORER_API.md, "Wave 1 - navigation methods").
skyfix-motion = { path = "../skyfix-motion" }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = { workspace = true }
