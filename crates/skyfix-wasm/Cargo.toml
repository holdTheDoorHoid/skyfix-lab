[package]
name = "skyfix-wasm"
description = "wasm-bindgen adapter exposing skyfix-core to the browser UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Integration switches. Flip a default here (one line) when the owning agent's core
# lands; until then the matching exports return `Err("not implemented: ...")` rather
# than panicking inside `todo!()` (wasm32 aborts on panic).
[features]
default = []
core-ready = []
ephemeris-ready = ["core-ready"]
sim-ready = ["core-ready"]

[dependencies]
skyfix-core = { path = "../skyfix-core" }
skyfix-ephemeris = { path = "../skyfix-ephemeris" }
skyfix-sim = { path = "../skyfix-sim" }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = { workspace = true }
